version: '3.8'

services:
  mgtx-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgtx-service
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Service__Port=8080
      - Logging__Level=Information
    volumes:
      - ./data/logs:/app/logs
      - ./data/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mgtx-network

networks:
  mgtx-network:
    driver: bridge
